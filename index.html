<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flip Ledger</title>
<meta name="theme-color" content="#f7f3ea">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea;--bg2:#f0eadb;--card:#fffdf8;--line:#e8dfca;--ink:#17261f;--mut:#65746a;--dim:#8d998f;
  --em:#0f4a37;--em2:#176b50;--gold:#b88a2a;--gold2:#e6c26b;--good:#1d8a57;--bad:#c4392b;--warn:#b7791f;
  --radius:18px;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --shadow:0 1px 0 #fff inset,0 10px 28px -14px rgba(23,60,45,.28),0 1px 3px rgba(23,60,45,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.42}
body{background:linear-gradient(180deg,#faf6ec 0,#f4efe2 100%) fixed;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
#app{max-width:780px;margin:0 auto;padding:16px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}
.brand{font-family:var(--serif);font-size:25px;letter-spacing:.1px;font-weight:600}
.brand b{color:var(--gold);font-style:italic;font-weight:600}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:10px}
.h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:22px 0 11px;display:flex;align-items:center;gap:10px}
.h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.gold{color:var(--gold)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--dim)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;color:#f7efd9;background:radial-gradient(120% 140% at 0% 0%,#1d7456 0%,#0f4a37 48%,#082a1f 100%);box-shadow:0 18px 40px -18px rgba(8,42,31,.7),0 0 0 1px rgba(230,194,107,.35) inset;margin-bottom:14px;cursor:pointer}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(230,194,107,.28);box-shadow:0 0 0 22px rgba(230,194,107,.05),0 0 0 44px rgba(230,194,107,.04)}
.hero .l{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#d9c48a}
.hero .v{font-family:var(--serif);font-size:44px;line-height:1.05;margin:8px 0 4px;background:linear-gradient(180deg,#fbe9b1,#e0b855);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.hero .s{font-size:13px;color:#cfe0d6}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .mini div{background:rgba(255,255,255,.07);border:1px solid rgba(230,194,107,.2);border-radius:12px;padding:8px 9px}
.hero .mini b{display:block;font-size:15px;font-family:var(--serif);color:#f7efd9}
.hero .mini span{font-size:11px;color:#b9cdc2}
.hero .go{position:absolute;right:16px;bottom:14px;font-size:12px;color:#e6c26b}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.tile:active,.li:active,.ycol:active{transform:scale(.985)}
.tile .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.tile .v{font-family:var(--serif);font-size:23px;margin-top:4px;font-weight:600}
.tile .s{color:var(--dim);font-size:12px;margin-top:2px}
.tile.arr:after{content:"›";float:right;color:var(--gold);font-size:20px;margin-top:-34px}
/* year columns */
.ycols{display:flex;align-items:flex-end;gap:12px;height:190px;padding:6px 2px 0}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;background:none;border:0;padding:0}
.ycol .bar2{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,var(--gold2),var(--gold));min-height:4px;box-shadow:0 8px 16px -10px rgba(184,138,42,.8)}
.ycol .val{font-family:var(--serif);font-weight:800;font-size:clamp(17px,5.4vw,24px);white-space:nowrap;margin-bottom:7px;color:#8a5f0d;letter-spacing:-.3px}
.ycol .yr{margin-top:6px;font-weight:700;font-size:14px}
.ycol .cnt{font-size:11px;color:var(--mut)}
.ycol.on .bar2{background:linear-gradient(180deg,#2a9a74,var(--em))}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--mut);background:var(--bg2);white-space:nowrap}
.chip.sold{color:var(--good);border-color:#b5dcc6;background:#eef8f1}.chip.active{color:#8a6414;border-color:#e6cd8a;background:#fbf3db}.chip.listed{color:#2f6fb0;border-color:#bcd4ec;background:#eef4fb}.chip.unknown{color:var(--warn);border-color:#ecd6a6;background:#fdf6e3}.chip.personal{color:var(--mut)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.li{display:block;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,246,236,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--em)}
nav button.on svg{stroke:var(--em);filter:drop-shadow(0 2px 4px rgba(15,74,55,.25))}
.tabs{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 13px;padding:2px 16px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;font-size:13.5px;font-weight:600}
.tab.on{background:var(--em);border-color:var(--em);color:#f7efd9;box-shadow:0 8px 18px -10px rgba(15,74,55,.8)}
.tab.cur{border-color:#e6cd8a;background:linear-gradient(180deg,#fff9e8,#fbf0cc);color:#7a5710}
.tab.cur.on{background:linear-gradient(180deg,#e6c26b,#b88a2a);color:#1a1405;border-color:#b88a2a}
input,select,textarea{width:100%;background:#fbf8ef;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,138,42,.15)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 17px;border-radius:13px;border:1px solid var(--em);background:linear-gradient(180deg,var(--em2),var(--em));color:#f7efd9;font-weight:700;cursor:pointer;box-shadow:0 10px 20px -12px rgba(15,74,55,.9)}
.btn.ghost{background:none;color:var(--em);box-shadow:none}
.btn.small{padding:6px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
details{border-top:1px solid var(--line)}
details>summary{list-style:none;cursor:pointer;padding:10px 0}
details>summary::-webkit-details-marker{display:none}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
td.r,th.r{text-align:right}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
tr.total td{font-weight:800;border-top:2px solid var(--gold2)}
.note{background:linear-gradient(180deg,#fffaf0,#fbf3de);border:1px solid #efdfb4;border-radius:13px;padding:10px 12px;color:#6b5a2c;font-size:13px;margin-bottom:13px}
.note.warn{color:#8a5a0c}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.back{background:none;border:0;color:var(--em);padding:4px 0;cursor:pointer;font-size:14px;font-weight:700;margin-bottom:6px}
.spark{display:block;width:100%;height:34px}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:17px;padding:0 4px}
.pass{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.pass dt{color:var(--mut)}.pass dd{margin:0;font-weight:600;text-align:right}
.est{color:var(--warn);font-size:11px;font-weight:700}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--bg2)}
/* COVER + PIN */
#cover{position:fixed;inset:0;z-index:50;background:radial-gradient(110% 70% at 50% 0%,#fff8e6 0%,#f7f1e0 50%,#efe6cf 100%);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:calc(30px + env(safe-area-inset-top)) 26px calc(22px + env(safe-area-inset-bottom));transition:opacity .6s ease,transform .6s ease;overflow:hidden}
#cover.hide{opacity:0;transform:translateY(-14px);pointer-events:none}
#cover .eyebrow{letter-spacing:3.5px;font-size:11px;color:var(--gold);text-transform:uppercase;font-weight:700}
#cover h1{font-family:var(--serif);font-weight:600;font-size:clamp(44px,13vw,72px);line-height:.98;margin:12px 0 8px;letter-spacing:-1px;color:var(--em)}
#cover h1 span{color:var(--gold);font-style:italic}
#cover .tag{font-size:16px;color:var(--mut);max-width:420px}
#cover .quote{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.45;color:#3b4a41;max-width:430px;margin-top:18px;border-left:2px solid var(--gold);padding-left:14px}
#cover .three{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
#cover .three span{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--em);border:1px solid #d9cfae;background:rgba(255,255,255,.5);padding:5px 10px;border-radius:99px;font-weight:700}
#cover svg.sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;opacity:.7;pointer-events:none}
#cover .z{position:relative;z-index:2}
.pin{display:flex;flex-direction:column;align-items:center;gap:10px}
.dots{display:flex;gap:14px;height:18px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--em);transition:all .15s}
.dots i.f{background:var(--em)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:10px 18px;margin-top:4px}
.pad button{height:56px;border-radius:50%;border:1px solid #d9cfae;background:rgba(255,255,255,.78);font-family:var(--serif);font-size:24px;font-weight:600;color:var(--em);cursor:pointer;box-shadow:0 6px 14px -8px rgba(15,74,55,.5)}
.pad button:active{background:var(--em);color:#f7efd9}
.pad .ghost{border-color:transparent;background:none;box-shadow:none;font-size:18px;color:var(--mut)}
.pinmsg{height:18px;font-size:13px;color:var(--bad);font-weight:600}
.rem{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin:0;font-weight:500}
.rem input{width:auto}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#cover .z>*{animation:rise .8s both}
#cover .z>*:nth-child(2){animation-delay:.1s}#cover .z>*:nth-child(3){animation-delay:.2s}#cover .z>*:nth-child(4){animation-delay:.3s}
@media (max-height:700px){#cover .quote,#cover .three{display:none}.pad button{height:48px}}
</style>
</head>
<body>
<div id="cover">
  <svg class="sky" id="sky" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice"></svg>
  <div class="z">
    <div class="eyebrow">Флиппинг · Актау · с 2024</div>
    <h1>Flip<br><span>Ledger</span></h1>
    <div class="tag">Книга сделок и ремонта — каждый тенге на своём месте.</div>
    <div class="quote">Прибыль рождается при покупке, но сохраняется — в каждой строке расходов.</div>
    <div class="three"><span>Купил с головой</span><span>Отремонтировал по смете</span><span>Продал с маржой</span></div>
  </div>
  <div class="z pin">
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pinmsg" id="pinmsg">Введите код</div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="ghost" disabled></button><button data-k="0">0</button><button class="ghost" data-k="del">⌫</button>
    </div>
    <label class="rem"><input type="checkbox" id="rem"> Запомнить на этом телефоне</label>
  </div>
</div>
<div id="app"></div>
<nav id="nav"></nav>
<script src="data.enc.js?v=14"></script>
<script>
(function(){
'use strict';
let D=null,RULES=[];
const KEY='flipledger.v1',TAX_RATE=0.10;
const GROUPS=['Работы','Черновые','Чистовые','Кафель','Электрика','Люстры','Сантехника','Мебель','Техника','Шторы','Ковры','Доставка и мусор','Прочее'];
const GCOL={'Работы':'#8c6a1e','Черновые':'#8a7a60','Чистовые':'#5b7f95','Кафель':'#1f8a7d','Электрика':'#d4701a','Люстры':'#e3b43f','Сантехника':'#2f6fb0','Мебель':'#7d55b0','Техника':'#9c3d54','Шторы':'#c2678b','Ковры':'#b8734a','Доставка и мусор':'#6b7a88','Прочее':'#8a929a'};
const ST={sold:'Продан',listed:'В продаже',active:'В ремонте',unknown:'Уточнить статус',personal:'Личный'};
const TYPES={material:'Материалы',work:'Работа',delivery:'Доставка / мусор',service:'Услуги / документы'};
const REPAIR_EXCL=['Мебель','Техника','Ковры'];
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

/* ---------- storage ---------- */
let LS={};
try{LS=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){LS={}}
LS.deal=LS.deal||{};LS.meta=LS.meta||{};LS.add=LS.add||{};LS.newObjs=LS.newObjs||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(LS))}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===undefined||v===null||v===''||isNaN(+v))?null:+v;
const money=n=>n==null?'—':Math.round(n).toLocaleString('ru-RU').replace(/[  ]/g,' ')+' ₸';
const mln=n=>n==null?'—':(n/1e6).toFixed(2).replace('.',',')+' млн';
const mln1=n=>n==null?'—':(n/1e6).toFixed(1).replace('.',',')+' млн';
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
const sgn=n=>n==null?'—':(n>=0?'+':'−')+mln(Math.abs(n));
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
function ev(str){
  let s=String(str||'').replace(/[‎  ]/g,' ');
  if(s.indexOf('=')>-1){const r=s.split('=').pop().replace(/\s/g,'');if(/^\d+$/.test(r))return +r;s=s.split('=')[0];}
  s=s.replace(/(\d) (?=\d{3}(?!\d))/g,'$1').replace(/\s/g,'').replace(/,/g,'.');
  if(!/^[\d+\-*.]+$/.test(s))return NaN;
  try{return Math.round(Function('"use strict";return ('+s+')')())}catch(e){return NaN}
}
function classify(name){
  const n=norm(name);
  for(const r of RULES){if(r.rx.test(n))return {g:r.g,s:r.s,t:r.t,y:r.y}}
  return {g:'Прочее',s:'Не распознано',t:String(name).trim(),y:'material'};
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdate(s){if(!s)return '';const m=/^(\d{4})-(\d\d)(?:-(\d\d))?/.exec(s);return m?(m[3]?m[3]+'.':'')+m[2]+'.'+m[1]:s}
function toDate(s){if(!s)return null;if(String(s).length===7){const y=+s.slice(0,4),m=+s.slice(5,7);return new Date(y,m,0)}return new Date(s)}

/* ---------- model ---------- */
function allObjects(){
  const mk=(o,own)=>Object.assign({},o,LS.meta[o.id]||{},{deal:Object.assign({},o.deal||{},LS.deal[o.id]||{}),items:(o.items||[]).concat(LS.add[o.id]||[]),own});
  const base=D.objects.map(o=>mk(o,false));
  const mine=LS.newObjs.map((o,i)=>mk(Object.assign({ord:100+i,src:'app',items:[],deal:{}},o),true));
  const arr=base.concat(mine);
  arr.forEach(o=>{if(o.id==='maek'||o.id==='samal-park-192')o.shared=D.shared});
  const rk=o=>o.status==='active'?0:(o.status==='personal'?3:(o.status==='sold'?2:1));
  const dt=o=>(o.status==='sold'?(o.deal&&o.deal.sellDate):o.start)||'';
  return arr.sort((a,b)=>rk(a)-rk(b)||(dt(b)<dt(a)?-1:dt(b)>dt(a)?1:0)||b.ord-a.ord);
}
function calc(o){
  const its=o.items.filter(i=>!i.x);
  const c={n:its.length,total:0,repair:0,ft:0,byG:{},byS:{},byY:{}};
  its.forEach(i=>{
    c.total+=i.a;
    if(REPAIR_EXCL.indexOf(i.g)>-1)c.ft+=i.a;else c.repair+=i.a;
    c.byG[i.g]=(c.byG[i.g]||0)+i.a;c.byY[i.y]=(c.byY[i.y]||0)+i.a;
    const k=i.g+'›'+i.s;c.byS[k]=(c.byS[k]||0)+i.a;
  });
  const d=o.deal||{};
  const buy=num(d.buy),sell=num(d.sell),realtor=num(d.realtor)||0,extra=num(d.extra)||0;
  const sD=num(d.sellDkp)!=null?num(d.sellDkp):sell,bD=num(d.buyDkp)!=null?num(d.buyDkp):buy;
  let tax=null;
  if(num(d.tax)!=null)tax=num(d.tax);
  else if(sD!=null&&bD!=null)tax=Math.max(0,Math.round(TAX_RATE*(sD-bD)));
  Object.assign(c,{buy,sell,realtor,extra,tax,sD,bD});
  c.costs=(buy||0)+c.total+realtor+(tax||0)+extra;
  c.margin=(buy!=null&&sell!=null)?sell-c.costs:null;
  c.roi=(c.margin!=null&&c.costs)?c.margin/c.costs:null;
  c.area=num(o.area);
  const d1=d.buyDate||o.start,d2=d.sellDate;c.months=null;
  if(d1&&d2){const m=(toDate(d2)-toDate(d1))/(86400000*30.4);if(m>0.2)c.months=m}
  c.perMonth=(c.margin!=null&&c.months)?c.margin/c.months:null;
  c.complete=buy!=null&&sell!=null;
  c.partial=c.n===0&&!o.norepair;
  c.valid=o.status==='sold'&&c.margin!=null&&!c.partial;
  c.year=(d.sellDate||'').slice(0,4);
  return c;
}
function rowsAll(){return allObjects().map(o=>({o,c:calc(o)}))}
function rowsFlip(){return rowsAll().filter(r=>r.o.status!=='personal')}
function stats(){
  const rows=rowsFlip();
  const sold=rows.filter(r=>r.o.status==='sold');
  const val=rows.filter(r=>r.c.valid);
  const sum=(a,f)=>a.reduce((s,r)=>s+f(r),0);
  const yrs={};
  sold.forEach(r=>{const y=r.c.year||'—';(yrs[y]=yrs[y]||[]).push(r)});
  const first=sold.map(r=>r.o.deal.sellDate).filter(Boolean).sort()[0];
  return {rows,sold,val,yrs,first,
    earned:sum(val,r=>r.c.margin),revenue:sum(val,r=>r.c.sell),tax:sum(val,r=>r.c.tax||0),realtor:sum(val,r=>r.c.realtor),
    spent:sum(rows,r=>r.c.total),
    avgRoi:val.length?sum(val,r=>r.c.roi)/val.length:null,
    missing:rows.filter(r=>r.o.status!=='active'&&!r.c.complete).length,
    partial:rows.filter(r=>r.o.status==='sold'&&r.c.partial).length,
    unrec:rows.reduce((s,r)=>s+r.o.items.filter(i=>!i.x&&(i.s==='Не распознано'||/уточнить/.test(i.s))).length,0)};
}

const S={tax:{y:'2026',fc:{}},tab:'home',obj:null,otab:'sum',of:'',os:'',oq:'',olim:60,ofl:'all',exp:{scope:'all',by:'g',drill:null,personal:false},mat:{q:'',g:''},ana:{sub:'dyn',year:null,rk:'margin',sel:null,cg:null,cm:'t'},calc:{buy:'',repair:'',realtor:'500000',sell:'',buyDkp:'',sellDkp:''}};

/* ---------- components ---------- */
function bars(map,total,attrf){
  const keys=Object.keys(map).filter(k=>map[k]>0).sort((a,b)=>map[b]-map[a]);
  return keys.map(k=>`<div style="margin:9px 0${attrf?';cursor:pointer':''}"${attrf?' '+attrf(k):''}><div class="row"><span><i class="dot" style="background:${GCOL[k]||'#888'}"></i>${esc(k)}</span><span class="num">${money(map[k])} <span class="mut">· ${pct(map[k],total)}</span></span></div><div class="bar" style="margin-top:5px"><i style="width:${Math.max(2,map[k]/total*100)}%;background:${GCOL[k]||'#888'}"></i></div></div>`).join('');
}
function spark(vals){
  if(vals.length<2)return '';
  const w=300,h=34,mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-8)+4,h-4-(v-mn)/r*(h-8)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--gold)"/>`).join('')}</svg>`;
}
function chip(st){return `<span class="chip ${st}">${ST[st]||st}</span>`}
function cumChart(deals){
  if(deals.length<2)return '';
  let acc=0;const pts=deals.map(r=>{acc+=r.c.margin;return {v:acc,d:r.o.deal.sellDate,n:r.o.name}});
  const W=340,H=170,pl=8,pr=8,pt=18,pb=26,mx=Math.max(...pts.map(p=>p.v))*1.05;
  const X=i=>pl+i/(pts.length-1)*(W-pl-pr),Y=v=>H-pb-v/mx*(H-pb-pt);
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  const area=`${X(0)},${H-pb} ${line} ${X(pts.length-1)},${H-pb}`;
  const lab=(i)=>{const d=pts[i].d;return d?MON[+d.slice(5,7)-1]+' '+d.slice(2,4):''};
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c26b" stop-opacity=".55"/><stop offset="1" stop-color="#e6c26b" stop-opacity="0"/></linearGradient></defs>
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  <polygon points="${area}" fill="url(#gA)"/><polyline points="${line}" fill="none" stroke="#b88a2a" stroke-width="2.6" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.6" fill="#fffdf8" stroke="#b88a2a" stroke-width="2"/>`).join('')}
  <text x="${pl}" y="${H-8}" font-size="10" fill="#8d998f">${lab(0)}</text><text x="${W-pr}" y="${H-8}" font-size="10" fill="#8d998f" text-anchor="end">${lab(pts.length-1)}</text>
  <text x="${X(pts.length-1)}" y="${Y(pts[pts.length-1].v)-9}" font-size="12" font-weight="700" fill="#0f4a37" text-anchor="end">${mln1(pts[pts.length-1].v)}</text></svg>`;
}
function dealRow(r,extra){
  const c=r.c,o=r.o;
  return `<div class="li" data-act="open" data-id="${o.id}"><div class="row"><span class="t grow">${esc(o.name)}</span><span class="num ${c.margin==null||c.partial?'mut':c.margin>=0?'good':'bad'}"><b>${c.margin==null?'—':sgn(c.margin)+(c.partial?'*':'')}</b></span></div>
  <div class="row hint" style="margin-top:3px"><span>${o.deal.sellDate?'продан '+fdate(o.deal.sellDate):ST[o.status]}${o.area?' · '+o.area+' м²':''}${o.typ?' · '+esc(o.typ):''}</span><span>${extra||''}</span></div>
  <div class="hint" style="margin-top:2px">${c.buy!=null?mln(c.buy):'?'} → ${c.sell!=null?mln(c.sell):'?'}${c.roi!=null&&!c.partial?' · ROI '+(c.roi*100).toFixed(0)+'%':''}</div></div>`;
}

  if(s.partial||s.missing||s.unrec){

function passport(o,c){
  const d=o.deal||{};

  return `<div class="card"><h3>Паспорт объекта</h3><dl class="pass">
   ${R('Адрес',esc(o.adr))}${R('Тип',esc(o.typ))}${R('Площадь',o.area?o.area+' м²':'')}${R('Подъезд',esc(o.ent))}${R('Этаж',esc(o.floor))}
   ${R('Купили за (факт)',c.buy!=null?money(c.buy):'')}${R('Покупка в ДКП',d.buyDkp!=null&&d.buyDkp!==''?money(d.buyDkp):'')}
   ${R('Продали за (факт)',c.sell!=null?money(c.sell):'')}${R('Продажа в ДКП',d.sellDkp!=null&&d.sellDkp!==''?money(d.sellDkp):'')}
   ${R('Дата продажи',d.sellDate?fdate(d.sellDate):'')}${R('Ремонт начат',o.start?fdate(o.start):'')}
   ${R('Риелтор',o.status==='sold'||d.realtor?(c.realtor?money(c.realtor):'без риелтора'):'')}${R('Налог',c.tax!=null&&(o.status==='sold'||d.sellDkp)?(c.tax?money(c.tax):'нет'):'')}
   ${R('Цена за м²',c.area&&c.sell?money(c.sell/c.area)+' (продажа)':(c.area&&c.buy?money(c.buy/c.area)+' (покупка)':''))}
  </dl>${o.dnote?`<div class="note" style="margin:12px 0 0">${esc(o.dnote)}</div>`:''}${o.chat?`<div class="hint" style="margin-top:8px">В чате расходов: «${esc(o.chat)}»</div>`:''}</div>`;
}
function pnl(o,c){
  const L=(t,v,cls,b)=>`<tr${b?' class="total"':''}><td>${t}</td><td class="r num ${cls||''}">${v}</td></tr>`;
  const baseNote=(c.sD!=null&&c.bD!=null&&num(o.deal.tax)==null)?` <span class="hint">(${mln(c.sD)} − ${mln(c.bD)})×10%</span>`:'';
  return `<table>
   ${o.status==='sold'?L('Дата продажи',o.deal&&o.deal.sellDate?fdate(o.deal.sellDate):'<span class="warn">указать в «Сделка»</span>'):''}
   ${L('Цена покупки',c.buy!=null?money(c.buy):'<span class="warn">заполнить</span>')}
   ${L('Ремонт',money(c.total))}
   ${L('Риелтор',money(c.realtor))}
   ${L('Налог'+baseNote,c.tax!=null?money(c.tax):'—')}
   ${c.extra?L('Прочие затраты',money(c.extra)):''}
   ${L('Всего затрат',money(c.costs),'',1)}

function contractBlock(o){
  if(!o.contract)return '';
  const paid=o.items.filter(i=>!i.x&&i.g==='Работы'&&(i.s==='Ремонтная бригада'||i.s==='Под ключ')).reduce((s,i)=>s+i.a,0),left=o.contract-paid;

  let h=passport(o,c);

  h+=`<div class="card"><h3>Результат сделки</h3>${pnl(o,c)}
  <div class="grid2" style="margin-top:12px">
   <div class="tile" style="cursor:default"><div class="l">ROI</div><div class="v">${c.roi!=null?(c.roi*100).toFixed(1).replace('.',',')+'%':'—'}</div></div>
   <div class="tile" style="cursor:default"><div class="l">Маржа / мес</div><div class="v">${c.perMonth!=null?mln(c.perMonth):'—'}</div><div class="s">${c.months?'срок ≈ '+c.months.toFixed(1).replace('.',',')+' мес.':'от старта ремонта до продажи'}</div></div>
   ${c.area&&c.total?`<div class="tile" style="cursor:default"><div class="l">Ремонт на м²</div><div class="v">${money(c.total/c.area)}</div></div>`:''}
   ${c.area&&c.margin!=null&&!c.partial?`<div class="tile" style="cursor:default"><div class="l">Маржа на м²</div><div class="v">${money(c.margin/c.area)}</div></div>`:''}
  </div>${c.complete?'':'<div class="note" style="margin:12px 0 0">Чтобы увидеть маржу, откройте «Сделка» и впишите цены покупки и продажи.</div>'}</div>`;
  if(c.total){
    h+=`<div class="card"><h3>Расходы по группам</h3>${bars(c.byG,c.total,k=>`data-act="itemgo" data-id="${o.id}" data-g="${esc(k)}" data-s=""`)}</div>`;
    h+=`<div class="card"><h3>Материалы и работа</h3>${Object.keys(c.byY).map(k=>`<div class="row" style="padding:4px 0"><span>${TYPES[k]||k}</span><span class="num">${money(c.byY[k])} <span class="mut">· ${pct(c.byY[k],c.total)}</span></span></div>`).join('')}</div>`;

}

    <div style="padding:0 15px 10px">${arr.map(i=>`<div style="padding:7px 0;border-top:1px solid var(--line);cursor:pointer" data-act="itemgo" data-id="${i.oid}" data-g="${esc(i.g)}" data-s="${esc(i.s)}"><div class="row"><span class="grow">${esc(i.n)}</span><span class="num">${money(i.a)}</span></div><div class="hint">${esc(i.o)} › ${esc(i.g)} ›${i.q?` · ${i.q} ${esc(i.u||'')} × ${money(i.p)}`:''}${i.x?' · детализация общей закупки':''}</div></div>`).join('')}</div></details>`}).join('');

function validDeals(){return rowsFlip().filter(r=>r.c.valid&&r.o.deal.sellDate).sort((a,b)=>(a.o.deal.sellDate+a.o.ord).localeCompare(b.o.deal.sellDate+b.o.ord))}

  <div class="tabs" style="flex-wrap:wrap;overflow:visible">${[['dyn','Динамика'],['rank','Рейтинг'],['seg','Сегменты'],['calc','Калькулятор'],['cmp','Сравнение ремонтов']].map(t=>`<button class="tab ${A.sub===t[0]&&!A.year?'on':''}" data-act="ana" data-sub="${t[0]}">${t[1]}</button>`).join('')}</div>`;

const TAXPAID0={'2025':3018100};
function taxPaid(y){const v=LS.taxPaid&&LS.taxPaid[y];return v!=null&&v!==''?+v:(TAXPAID0[y]||0)}

    h+=`<div class="hero" style="cursor:default"><div class="l">Налогов за всё время</div><div class="v">${mln(tot)}</div><div class="s">уплачено ${mln(paid)} · остаток ${mln(tot-paid)}</div></div>
    <div class="card"><table><tr><th>Год</th><th class="r">Начислено</th><th class="r">Уплачено</th><th class="r">Остаток</th></tr>${ys.map(x=>`<tr data-act="taxy" data-y="${x}" style="cursor:pointer"><td><b>${x}</b> ›</td><td class="r num">${money(acc(x))}</td><td class="r num">${money(taxPaid(x))}</td><td class="r num ${acc(x)-taxPaid(x)>0?'bad':'good'}"><b>${money(acc(x)-taxPaid(x))}</b></td></tr>`).join('')}</table></div>`;
  }else{
    const a=acc(y),p=taxPaid(y),left=a-p;
    h+=`<div class="hero" style="cursor:default"><div class="l">Налог за ${y} год</div><div class="v">${mln(a)}</div><div class="s">${left>0?'к уплате ещё '+money(left):(left<0?'переплата '+money(-left):'оплачено полностью')}</div>
    <div class="mini"><div><b>${mln(base(y))}</b><span>налоговая база</span></div><div><b>${byY(y).length}</b><span>сделок</span></div><div><b>${mln(p)}</b><span>уплачено</span></div></div></div>
    <div class="card"><h3>Сколько уплачено за ${y}</h3><div class="grid2"><div><label>Уплачено, ₸</label><input data-taxpaid="${y}" inputmode="numeric" value="${p||''}" placeholder="0"></div><div><label>К уплате</label><div id="taxLeft" class="num" style="font-size:20px;font-weight:800;padding-top:8px;color:${left>0?'var(--bad)':'var(--good)'}">${money(left)}</div></div></div></div>
    <div class="card"><h3>Сделки ${y} года</h3><div class="hint" style="margin-bottom:6px">Налог = 10% × (ДКП продажи − ДКП покупки). Нажмите на сделку — откроется карточка.</div>
    <table><tr><th>Объект</th><th class="r">База</th><th class="r">Налог</th></tr>${byY(y).sort((p,q)=>q.o.deal.sellDate.localeCompare(p.o.deal.sellDate)).map(r=>`<tr data-act="open" data-id="${r.o.id}" style="cursor:pointer"><td><b>${esc(r.o.name)}</b> ›<div class="hint">ДКП ${mln(r.c.bD)} → ${mln(r.c.sD)} · продан ${fdate(r.o.deal.sellDate)}</div></td><td class="r num">${money(Math.max(0,(r.c.sD||0)-(r.c.bD||0)))}</td><td class="r num"><b>${money(r.c.tax||0)}</b></td></tr>`).join('')}
    <tr class="total"><td>Итого</td><td class="r num">${money(base(y))}</td><td class="r num">${money(a)}</td></tr></table></div>`;
  }
  const act=rowsFlip().filter(r=>r.o.status==='active');
  if(act.length)h+=`<div class="card"><h3>Прогноз по текущим объектам</h3><div class="hint" style="margin-bottom:8px">Впишите цену продажи в ДКП — посчитаем налог.</div>${act.map(r=>{const bd=r.c.bD,sv=T.fc[r.o.id];const tx=(sv!=null&&sv!==''&&bd!=null)?Math.max(0,Math.round(TAX_RATE*(+sv-bd))):null;return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row"><b data-act="open" data-id="${r.o.id}" style="cursor:pointer">${esc(r.o.name)} ›</b><span class="hint">ДКП покупки ${bd!=null?mln(bd):'не указана'}</span></div><div class="grid2" style="margin-top:6px"><div><label>ДКП продажи, ₸</label><input data-tf="${r.o.id}" inputmode="numeric" value="${esc(sv||'')}" placeholder="например 35000000"></div><div><label>Налог</label><div class="num" id="tf_${r.o.id}" style="font-size:18px;font-weight:800;padding-top:8px">${tx!=null?money(tx):'—'}</div></div></div></div>`}).join('')}</div>`;
  return h;
}
function calcOut(){
  const C=S.calc,buy=num(C.buy),sell=num(C.sell);
  if(buy==null||sell==null)return '<div class="hint">Введите цену покупки и продажи.</div>';
  const rep=num(C.repair)!=null?num(C.repair):0,rl=num(C.realtor)||0,bD=num(C.buyDkp)!=null?num(C.buyDkp):buy,sD=num(C.sellDkp)!=null?num(C.sellDkp):sell;
  const tax=Math.max(0,Math.round(TAX_RATE*(sD-bD))),costs=buy+rep+rl+tax,m=sell-costs;
  return `<table><tr><td>Затраты (покупка + ремонт + риелтор)</td><td class="r num">${money(buy+rep+rl)}</td></tr><tr><td>Налог</td><td class="r num">${money(tax)}</td></tr><tr class="total"><td>Маржа</td><td class="r num ${m>=0?'good':'bad'}">${m>=0?'+':'−'}${money(Math.abs(m))}</td></tr><tr><td>ROI</td><td class="r num">${(m/costs*100).toFixed(1).replace('.',',')}%</td></tr></table>`;
}

  else if(a==='matgo'){S.tab='mat';S.obj=null;S.mat.q=el.dataset.q;S.mat.g='';render()}
  else if(a==='expgo'){S.tab='exp';S.obj=null;S.exp.scope=el.dataset.id;S.exp.by=el.dataset.b||'s';S.exp.drill=el.dataset.k;render()}
  else if(a==='open'){S.os='';S.tab='objects';S.obj=el.dataset.id;S.otab='sum';S.of='';S.oq='';S.olim=60;render()}
  else if(a==='otab'){S.otab=el.dataset.t;S.of='';S.os='';S.oq='';S.olim=60;render()}
  else if(a==='ofl'){S.ofl=el.dataset.f;render(true)}
  else if(a==='of'){S.of=el.dataset.g;S.os='';S.olim=60;render(true)}
  else if(a==='more'){S.olim+=100;render(true)}
  else if(a==='scope'){S.exp.scope=el.dataset.id;S.exp.drill=null;render(true)}
  else if(a==='by'){S.exp.by=el.dataset.b;S.exp.drill=null;render(true)}
  else if(a==='drill'){S.exp.drill=S.exp.drill===el.dataset.k?null:el.dataset.k;render(true)}
  else if(a==='mg'){S.mat.g=el.dataset.g;render(true)}
  else if(a==='mqclr'){S.mat.q='';render(true);const q=$('#mq');if(q)q.focus()}
  else if(a==='mq'){S.mat.q=el.dataset.q;render()}
  else if(a==='ana'){S.ana.sub=el.dataset.sub;S.ana.year=null;render()}
  else if(a==='year'){S.tab='ana';S.ana.sub='dyn';S.ana.year=el.dataset.y||null;render()}
  else if(a==='rk'){S.ana.rk=el.dataset.k;render(true)}
  else if(a==='taxy'){S.tab='tax';S.tax.y=el.dataset.y;render()}
  else if(a==='cmpm'){S.ana.cm=el.dataset.m;render(true)}
  else if(a==='cmpg'){S.ana.cg=el.dataset.g||null;render(true)}
  else if(a==='cmpsel'){const all=cmpRows().map(r=>r.o.id);let s=S.ana.sel||all.slice();const k=el.dataset.id;s=s.indexOf(k)>-1?s.filter(x=>x!==k):s.concat(k);S.ana.sel=s.length?s:null;render(true)}
  else if(a==='newobj'){S.tab='newobj';render()}
  else if(a==='savenew'){
    const name=($('#no_name').value||'').trim();if(!name){$('#no_name').focus();return}
    const id='o'+Date.now().toString(36);
    LS.newObjs.push({id,name,start:$('#no_start').value||null,status:$('#no_st').value,area:$('#no_area').value||'',budget:$('#no_bud').value||''});
    if($('#no_buy').value)LS.deal[id]={buy:+$('#no_buy').value};
    save();S.tab='objects';S.obj=id;S.otab='items';render();
  }
  else if(a==='additem'){
    const name=($('#ae_n').value||'').trim(),amt=ev($('#ae_a').value);
    if(!name||isNaN(amt)||amt<=0){alert('Укажите название и сумму');return}
    const c=classify(name),g=$('#ae_g').value||c.g;
    const it={n:name,a:amt,g:g,s:c.s,t:c.t,y:c.y,d:$('#ae_d').value||today(),add:Date.now().toString(36)};
    const id=el.dataset.id;(LS.add[id]=LS.add[id]||[]).push(it);save();render(true);
  }
  else if(a==='delitem'){const id=el.dataset.id;LS.add[id]=(LS.add[id]||[]).filter(i=>i.add!==el.dataset.i);save();render(true)}
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(LS,null,1)],{type:'application/json'});
    const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='flip-ledger-backup-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);
  }
  else if(a==='import'){$('#impf').click()}
  else if(a==='lock'){try{sessionStorage.removeItem('fl.pin');localStorage.removeItem('fl.pin')}catch(_){}location.reload()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impf'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);LS=Object.assign({deal:{},meta:{},add:{},newObjs:[]},j);save();render();alert('Копия загружена')}catch(_){alert('Не удалось прочитать файл')}};r.readAsText(t.files[0]);
  }
  else if(t.id==='exp_scope'){S.exp.scope=t.value;S.exp.drill=null;render(true)}
  else if(t.id==='exp_pers'){S.exp.personal=t.checked;render(true)}
  else if(t.dataset.deal){
    const id=S.obj;LS.deal[id]=LS.deal[id]||{};const v=t.value.trim();
    if(v==='')LS.deal[id][t.dataset.deal]=null;else LS.deal[id][t.dataset.deal]=/Date$/.test(t.dataset.deal)?v:(isNaN(ev(v))?v:ev(v));
    save();const o=allObjects().find(x=>x.id===id);const p=$('#dealPrev');if(p)p.innerHTML=pnl(o,calc(o));
  }
  else if(t.dataset.meta){
    const id=S.obj;LS.meta[id]=LS.meta[id]||{};LS.meta[id][t.dataset.meta]=t.value;save();
    if(['status','name','adr'].indexOf(t.dataset.meta)>-1)render(true);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='mq'){S.mat.q=t.value;clearTimeout(window._mt);window._mt=setTimeout(()=>{const pos=t.selectionStart;render(true);const n=$('#mq');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}
  else if(t.id==='oq'){S.oq=t.value;S.olim=60;clearTimeout(window._ot);window._ot=setTimeout(()=>{const pos=t.selectionStart;render(true);const n=$('#oq');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}
  else if(t.dataset.taxpaid!==undefined){const y=t.dataset.taxpaid;LS.taxPaid=LS.taxPaid||{};const v=t.value.trim();LS.taxPaid[y]=v===''?null:(isNaN(ev(v))?0:ev(v));save();const rs=rowsFlip().filter(r=>r.o.status==='sold'&&(r.o.deal.sellDate||'').slice(0,4)===y);const a=rs.reduce((s,r)=>s+(r.c.tax||0),0),l=a-taxPaid(y),e=$('#taxLeft');if(e){e.textContent=money(l);e.style.color=l>0?'var(--bad)':'var(--good)'}}
  else if(t.dataset.tf){S.tax.fc[t.dataset.tf]=t.value;const r=rowsFlip().find(x=>x.o.id===t.dataset.tf),v=ev(t.value.trim()),e=$('#tf_'+t.dataset.tf);if(e)e.textContent=(r&&r.c.bD!=null&&!isNaN(v))?money(Math.max(0,Math.round(TAX_RATE*(v-r.c.bD)))):'—'}
  else if(t.dataset.calc){S.calc[t.dataset.calc]=t.value;const o=$('#calcOut');if(o)o.innerHTML=calcOut()}
  else if(t.id==='ae_n'){const h=$('#ae_hint');if(h){const c=t.value.trim()?classify(t.value):null;h.textContent=c?('→ '+c.g+' › '+c.s):'определится по названию'}}
});

/* ---------- cover + PIN ---------- */
function drawSky(){
  const svg=$('#sky');let s='',x=-10,seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  while(x<410){
    const w=34+Math.floor(rnd()*30),h=60+Math.floor(rnd()*125),y=200-h;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(15,74,55,${(.05+rnd()*.07).toFixed(2)})" stroke="rgba(15,74,55,.35)" stroke-width=".8"/>`;
    for(let wy=y+8;wy<196;wy+=11)for(let wx=x+6;wx<x+w-6;wx+=9){if(rnd()>.74)s+=`<rect x="${wx}" y="${wy}" width="4" height="5.5" fill="#d3a640" opacity="${(.4+rnd()*.5).toFixed(2)}"/>`}
    x+=w+3+Math.floor(rnd()*6);
  }
  svg.innerHTML=s;
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pin){
  const E=window.FLIP_ENC;
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function startApp(data){
  D=data;RULES=(D.rules||[]).map(r=>({rx:new RegExp(r[0],'i'),g:r[1],s:r[2],t:r[3],y:r[4]}));
  $('#cover').classList.add('hide');render();
}
let buf='',busy=false;
function paint(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<buf.length))}
async function submit(){
  if(busy)return;busy=true;$('#pinmsg').style.color='var(--mut)';$('#pinmsg').textContent='Проверяю…';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    const data=await decrypt(buf);
    try{(($('#rem').checked)?localStorage:sessionStorage).setItem('fl.pin',buf)}catch(_){}
    busy=false;startApp(data);
  }catch(e){
    busy=false;$('#pinmsg').style.color='var(--bad)';
    $('#pinmsg').textContent=(e&&e.message==='nocrypto')?'Откройте приложение по https-ссылке':'Неверный код';
    const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');buf='';paint();
  }
}
function press(k){
  if(busy)return;
  if(k==='del'){buf=buf.slice(0,-1)}
  else if(/^\d$/.test(k)&&buf.length<4){buf+=k}
  paint();if(buf.length===4)submit();
}
$('#pad').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)press(b.dataset.k)});
document.addEventListener('keydown',e=>{if($('#cover').classList.contains('hide'))return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del')});
drawSky();
(async function boot(){
  let pin=null;try{pin=sessionStorage.getItem('fl.pin')||localStorage.getItem('fl.pin')}catch(_){}
  if(pin&&window.crypto&&crypto.subtle){try{const data=await decrypt(pin);startApp(data);}catch(e){try{sessionStorage.removeItem('fl.pin');localStorage.removeItem('fl.pin')}catch(_){}}}
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
})();
